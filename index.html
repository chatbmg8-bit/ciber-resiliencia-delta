<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ciber Resiliencia como Servicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Paleta propia: verde pino + grafito. Sin azules corporativos. El color fuerte solo marca la acción principal y el estado. */
  --pri:#1d6b57; --pri-d:#14513f; --pri-f:#e7f2ee; --anillo:#6bb79f;
  --osc:#18211e; --tinta:#252c29; --suave:#5d6863; --fondo:#f4f5f3; --papel:#ffffff; --borde:#dfe3e0; --linea-in:#c6cdc9;
  --rojo:#b42318; --amarillo:#b54708; --verde:#2e7d4f; --rojo-f:#fdeceb; --amarillo-f:#fef4e2; --verde-f:#e6f4ec;
  --sombra:0 1px 2px rgba(24,33,30,.05),0 1px 3px rgba(24,33,30,.06);
  --fuente:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fuente);background:var(--fondo);color:var(--tinta);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%;font-feature-settings:"cv11","ss01"}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
main.wrap{padding-top:32px;padding-bottom:64px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.25;color:var(--osc)}
h1{font-size:1.7rem;font-weight:700;letter-spacing:-.02em}
h2{font-size:1.12rem;font-weight:650;letter-spacing:-.01em}
h3{font-size:1rem;font-weight:650;margin-top:14px}
h2 small,h3 small{font-weight:400;color:var(--suave);font-size:.85rem;margin-left:6px}
p{margin:0}
a{color:var(--pri)}
code{background:var(--pri-f);color:var(--pri-d);padding:2px 7px;border-radius:5px;font-size:.92em;font-weight:600;font-family:ui-monospace,Consolas,monospace}
small,.mini{font-size:.82rem;color:var(--suave)}
.lead{font-size:1.04rem;color:var(--suave);max-width:68ch}
.eyebrow{font-size:.76rem;font-weight:650;letter-spacing:.07em;text-transform:uppercase;color:var(--pri)}
.nota{font-size:.88rem;color:var(--suave)}
.tag-pd,.tag-ver{background:var(--amarillo-f);color:#7a3d06;border-radius:4px;padding:1px 6px;font-size:.85em;font-weight:600;white-space:nowrap}
.tag-ver{white-space:normal}

/* Encabezado claro */
.top{background:var(--papel);border-bottom:1px solid var(--borde);position:sticky;top:0;z-index:20}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding-top:12px;padding-bottom:8px}
.brand{display:flex;align-items:center;gap:11px;color:var(--osc);text-decoration:none}
.brand b{display:block;font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.brand em{font-style:normal;font-size:.78rem;color:var(--suave)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--osc);color:#fff;display:grid;place-items:center;flex:none}
.logo svg{width:19px;height:19px}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctl select{max-width:240px;min-height:38px;padding:6px 10px}
.quien{font-size:.86rem;color:var(--suave);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.quien b{color:var(--osc)}
.modo-c{background:var(--osc);color:#fff;border-radius:6px;padding:3px 9px;font-size:.75rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs .wrap{display:flex;gap:2px}
.tabs a{color:var(--suave);text-decoration:none;padding:10px 12px 11px;font-size:.92rem;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:7px}
.tabs a:hover{color:var(--osc)}
.tabs a.on{color:var(--osc);border-bottom-color:var(--pri);font-weight:650}
.tabs .st{font-size:.72rem;font-weight:650;background:#eef0ee;color:var(--suave);border-radius:10px;padding:1px 7px;font-variant-numeric:tabular-nums}
.tabs .st.ok{background:var(--verde-f);color:var(--verde)}

/* Bloques */
.card{background:var(--papel);border:1px solid var(--borde);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sombra)}
.card.aviso{border-left:4px solid var(--amarillo)}
.card.unir{border-top:4px solid var(--pri)}
.card.activo-c{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri-f)}
.hero{padding:8px 0 4px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(1.55rem,3.6vw,2.1rem);max-width:24ch}
.activo{color:var(--suave);font-size:.95rem}
.grid2,.grid3,.grid4{display:grid;gap:16px}
.grid2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.grid3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.sep{margin-top:8px}
.big{background:var(--papel);color:var(--osc);border:1px solid var(--borde);box-shadow:var(--sombra);text-decoration:none;border-radius:12px;padding:22px 20px;display:flex;flex-direction:column;gap:4px;min-height:104px;transition:background .15s}
.big:hover{border-color:var(--pri)}
.big b{font-size:1.2rem}
.big span{font-size:.88rem;color:var(--suave)}
.lista{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-x:auto}

/* Controles */
input,select,textarea,button{font:inherit}
input[type=text],input[type=password],input[type=number],input[type=date],input:not([type]),select,textarea{width:100%;padding:9px 11px;border:1px solid var(--linea-in);border-radius:8px;background:#fff;color:var(--tinta);min-height:42px}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--anillo);outline-offset:2px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>label{font-size:.9rem;font-weight:600;color:var(--osc)}
.btn{border:1px solid var(--linea-in);gap:8px;justify-content:center;transition:background .15s,border-color .15s;background:#fff;color:var(--osc);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:42px}
.btn:hover{background:var(--pri-f)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.p:hover{background:var(--pri-d)}
.btn.no{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.85rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lnk{border:0;background:none;color:var(--pri);text-decoration:underline;cursor:pointer;padding:0;font-size:inherit}
.chk{display:flex;gap:9px;align-items:flex-start;padding:5px 0;cursor:pointer}
.chk input{width:19px;height:19px;margin-top:3px;flex:none;accent-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:4px 18px}
.chip{border:1px solid var(--linea-in);background:var(--papel);color:var(--osc);border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600}
.unir input,#in-alias{max-width:260px}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:650;background:#eef0ee;color:#4a524e;white-space:nowrap}
.pill.ok{background:var(--verde-f);color:var(--verde)}
.pill.g-alta{background:var(--rojo-f);color:var(--rojo)}
.pill.g-media{background:var(--amarillo-f);color:#7a4d06}
.pill.g-baja{background:#eef0ee;color:#4a524e}
.pill.pres{background:var(--pri-f);color:var(--pri)}
.pill.auto{background:#f1eefa;color:#5b4a8a}
.pill.ent{background:#f6efe4;color:#7a5418}
.pill.sup{background:var(--amarillo-f);color:#7a4d06}

/* Capacitación */
.tile{background:var(--papel);border:1px solid var(--borde);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.tile span{font-size:.82rem;color:var(--suave)}
.tile b{font-size:1.5rem;color:var(--osc);font-variant-numeric:tabular-nums}
.tile.ok{border-color:var(--verde);background:var(--verde-f)}
.tile.cont{min-width:200px}
.paso{flex-direction:row;justify-content:space-between;align-items:center;flex-wrap:wrap}
.paso>div{display:flex;flex-direction:column;gap:4px;max-width:62ch}
.mods{display:flex;flex-direction:column;gap:8px}
.mod{display:flex;gap:14px;align-items:center;text-align:left;background:var(--papel);border:1px solid var(--borde);border-radius:10px;padding:14px 16px;cursor:pointer;color:inherit;flex-wrap:wrap}
.mod:hover{border-color:var(--pri)}
.mod .n,.card h2 .n{width:32px;height:32px;border-radius:50%;background:var(--osc);color:#fff;display:inline-grid;place-items:center;font-weight:700;flex:none;font-size:.95rem}
.mod.hecho .n{background:var(--verde)}
.mod .tx{flex:1 1 280px;display:flex;flex-direction:column}
.mod .tx em{font-style:normal;font-size:.85rem;color:var(--suave)}
.mod .tags{display:flex;gap:6px;flex-wrap:wrap}
.prog{height:6px;background:#e3e7e4;border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)}
.ops{display:flex;flex-direction:column;gap:8px}
.op{text-align:left;border:1px solid var(--linea-in);background:#fff;border-radius:9px;padding:12px 14px;cursor:pointer;color:var(--tinta)}
.op:hover:not(:disabled){border-color:var(--pri);background:var(--pri-f)}
.op.sel{border-color:var(--pri);background:var(--pri-f);box-shadow:inset 0 0 0 1px var(--pri)}
.op.bien{border-color:var(--verde);background:var(--verde-f)}
.op.mal{border-color:var(--rojo);background:var(--rojo-f)}
.op:disabled{cursor:default;color:var(--tinta)}
.fb{border-radius:9px;padding:12px 14px;border-left:5px solid}
.fb.bien{background:var(--verde-f);border-color:var(--verde)}
.fb.mal{background:var(--amarillo-f);border-color:var(--amarillo)}
.caso,.escenario{font-size:1.05rem}
.escenario{background:var(--pri-f);border-radius:9px;padding:14px 16px}
.leccion>div{max-width:72ch}
.leccion ul,.leccion ol{margin:6px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.fuentes{border-top:1px solid var(--borde);padding-top:10px;font-size:.82rem;color:var(--suave)}
.fuentes ul{margin:4px 0;padding-left:18px}
.fuentes a{word-break:break-all}
.qa{border-top:1px solid var(--borde);padding-top:10px;display:flex;flex-direction:column;gap:3px}
.qa .bien{color:var(--verde)} .qa .mal{color:var(--rojo)} .qa .exp{color:var(--suave);font-size:.9rem}
/* Correo simulado */
.mail{border:1px solid var(--linea-in);border-radius:10px;overflow:visible;background:#fff}
.mh{background:#f3f5f3;padding:12px 16px;border-bottom:1px solid var(--borde);border-radius:10px 10px 0 0;display:flex;flex-direction:column;gap:3px;font-size:.92rem;word-break:break-word}
.mh span{display:inline-block;width:62px;color:var(--suave)}
.mb{padding:16px;display:flex;flex-direction:column;gap:12px}
.mlink{color:#1d4ed8;text-decoration:underline;cursor:pointer;position:relative;display:inline-block}
.mlink:hover::after,.mlink:focus::after{content:"Lleva a: " attr(data-url);position:absolute;left:0;top:100%;margin-top:6px;background:var(--osc);color:#fff;padding:6px 10px;border-radius:6px;font-size:.8rem;white-space:nowrap;z-index:5;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
.adj{background:#f3f5f3;border:1px solid var(--borde);border-radius:7px;padding:7px 11px;align-self:flex-start;font-size:.9rem}
.sen{border:1px solid var(--borde);border-radius:10px;padding:10px 16px;margin:0}
.sen legend{font-weight:600;font-size:.9rem;padding:0 6px}
.chk.presente span{background:var(--amarillo-f);font-weight:600;border-radius:4px;padding:0 4px}
.dec{justify-content:center}
.dec .btn{flex:1 1 160px;justify-content:center;font-size:1.05rem;min-height:52px}
.big-ok{border-color:var(--verde);color:var(--verde)} .big-no{border-color:var(--rojo);color:var(--rojo)}

/* Tablas */
.t{width:100%;border-collapse:collapse;font-size:.9rem}
.t th,.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--borde);vertical-align:top}
.t thead th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--suave);font-weight:650;white-space:nowrap}
.t tbody th{font-weight:650;color:var(--osc)}
.t.num td,.t.tab td{font-variant-numeric:tabular-nums}
.t.num td,.t.num thead th:not(:first-child){text-align:right}
.t .tot th,.t .tot td{font-weight:700;border-top:2px solid var(--osc);font-size:1rem}
.t.ed td{padding:5px 6px;min-width:120px}
.t.ed td.c{min-width:0;text-align:center}
.t.ed td.c input{width:19px;height:19px;accent-color:var(--pri)}
.t.inv input,.t.inv select{min-height:38px;padding:6px 8px}
.t.tab input{width:80px}

/* Diagnóstico */
.nist{font-size:.85rem;color:var(--pri);font-weight:600}
.nist small{font-weight:400}
.dq{display:flex;justify-content:space-between;align-items:center;gap:10px 20px;padding:10px 0;border-top:1px solid var(--borde);flex-wrap:wrap}
.dq p{flex:1 1 320px}
.r3,.r5{display:flex;gap:6px;flex-wrap:wrap}
.r3 label,.r5 label{cursor:pointer}
.r3 input,.r5 input{position:absolute;opacity:0;pointer-events:none}
.r3 span,.r5 span{display:inline-block;border:1px solid var(--linea-in);border-radius:8px;padding:8px 13px;font-size:.9rem;background:#fff;min-width:46px;text-align:center}
.r3 input:checked+span,.r5 input:checked+span{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:650}
.r3 input:focus-visible+span,.r5 input:focus-visible+span{outline:3px solid var(--anillo);outline-offset:2px}
.resumen{border-top:5px solid var(--osc)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.doms{display:flex;flex-direction:column;gap:8px}
.dom{display:grid;grid-template-columns:minmax(150px,240px) 1fr auto;gap:12px;align-items:center;font-size:.9rem}
.bar{height:10px;background:#e7eae8;border-radius:5px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px}
.b-rojo{background:var(--rojo)} .b-amarillo{background:#e0a422} .b-verde{background:var(--verde)} .b-gris{background:var(--linea-in)}
.sem{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;font-weight:650;white-space:nowrap}
.sem i{width:11px;height:11px;border-radius:50%;display:inline-block}
.sem-rojo{color:var(--rojo)} .sem-rojo i{background:var(--rojo)}
.sem-amarillo{color:#7a4d06} .sem-amarillo i{background:#e0a422}
.sem-verde{color:var(--verde)} .sem-verde i{background:var(--verde)}
.sem-gris{color:var(--suave)} .sem-gris i{background:var(--linea-in)}
.hall{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:5px;font-size:.92rem}
.hall b{color:var(--pri);display:inline-block;min-width:34px}
.meta{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--borde);flex-wrap:wrap}
.meta>div{flex:1 1 320px}

/* Documentos (reporte, plan, política) */
.paper{background:#fff;border:1px solid var(--borde);border-radius:6px;box-shadow:0 4px 18px rgba(24,33,30,.08);padding:34px 38px;overflow-x:auto}
.docp{display:flex;flex-direction:column;gap:9px;font-size:.9rem;line-height:1.45;min-width:0}
.docp h1{font-size:1.4rem}
.docp h2{font-size:1rem;margin-top:8px;padding-bottom:3px;border-bottom:2px solid var(--osc)}
.docp h3{font-size:.9rem;margin-top:0}
.dh{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;border-bottom:3px solid var(--pri);padding-bottom:8px;flex-wrap:wrap}
.dm{text-align:right;font-size:.85rem;color:var(--suave)}
.dm b{color:var(--osc)}
.docp ul,.docp ol{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:3px}
.docp .t{font-size:.84rem}
.docp .t th,.docp .t td{padding:5px 7px}
.docp .tile{padding:8px 10px}
.docp .tile b{font-size:1.15rem}
.docp .grid3{grid-template-columns:repeat(3,1fr);gap:8px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.cols2r{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.plan>div{background:#f5f7f5;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.semt td:nth-child(2){width:32%}
.linea{border-bottom:1px solid #8b948f;color:#8b948f;font-size:.8em;padding:0 18px 0 2px;font-style:italic}
.box{display:inline-block;width:14px;height:14px;border:1.5px solid var(--osc);border-radius:3px}
.firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
.firmas div{border-top:1px solid var(--osc);padding-top:4px;font-size:.82rem;text-align:center}
.pb{height:0;margin:26px 0;border-top:1px dashed var(--borde)}
.pasosdoc li{padding-left:2px}
.pdfdoc{width:740px;font-family:var(--fuente);color:var(--tinta)}
.pdfdoc .pb{border:0;margin:0}

.pie{border-top:1px solid var(--borde);background:#eceeeb;padding:18px 0;font-size:.82rem;color:var(--suave)}
.pie .wrap{display:flex;flex-direction:column;gap:4px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--osc);color:#fff;padding:11px 18px;border-radius:9px;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:50;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{display:none;position:fixed;inset:0;background:rgba(24,33,30,.55);z-index:60;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;padding:22px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px}
#print-area{display:none}

@media (max-width:640px){
  body{font-size:15.5px}
  .wrap{padding:0 16px}
  .card{padding:16px}
  .paper{padding:18px 16px}
  .cols3,.cols2r,.docp .grid3{grid-template-columns:1fr}
  .dom{grid-template-columns:1fr auto}
  .dom .bar{grid-column:1/-1;order:3}
  .brand em{display:none}
  .ctl{width:100%}
  .ctl select{flex:1;max-width:none}
  .dm{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@page{size:letter;margin:13mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  #app,#toast,#modal{display:none!important}
  #print-area{display:block}
  .doc .docp{font-size:9.6pt}
  .pb{break-before:page;border:0;margin:0}
  .t tr,.plan>div,.tile{break-inside:avoid}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
details>summary{cursor:pointer;font-weight:650;color:var(--osc);padding:4px 0}
details.guia ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
#m-txt,#in-cod{font-family:ui-monospace,Consolas,monospace;font-size:.82rem;word-break:break-all}

/* ===== Ruta del participante ===== */
.chip:hover{border-color:var(--pri);background:var(--pri-f)}
.hola{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.avance{min-width:240px;flex:0 1 320px;display:flex;flex-direction:column;gap:6px}
.avance .prog{height:8px}
.avance small b{color:var(--osc)}
.sigue{display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;background:var(--osc);color:#fff;border-radius:14px;padding:24px 26px}
.sigue h2{color:#fff;font-size:1.3rem}
.sigue p{color:rgba(255,255,255,.78)}
.sigue .eyebrow{color:#9fd3c1}
.sigue .btn.p{background:#fff;color:var(--osc);border-color:#fff;min-height:48px;padding:10px 22px;font-size:1rem}
.sigue .btn.p:hover{background:var(--pri-f)}
.sigue.fin{background:var(--verde-f);color:var(--tinta)}
.sigue.fin h2{color:var(--verde)} .sigue.fin p{color:var(--tinta)}
.etapas{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.etapa{background:var(--papel);border:1px solid var(--borde);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sombra)}
.etapa h3{margin:0;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--suave);display:flex;justify-content:space-between;gap:8px}
.etapa h3 span{text-transform:none;letter-spacing:0;font-weight:500}
.paso-r{display:flex;gap:10px;align-items:flex-start;text-align:left;border:0;background:none;padding:7px 8px;margin:0 -8px;border-radius:8px;cursor:pointer;color:var(--tinta);font-size:.93rem;line-height:1.35}
.paso-r:hover{background:#f3f5f3}
.paso-r i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--linea-in);margin-top:1px;display:grid;place-items:center;font-style:normal;font-size:.7rem;color:#fff}
.paso-r.ok i{background:var(--verde);border-color:var(--verde)}
.paso-r.ok i::after{content:"✓"}
.paso-r.ok{color:var(--suave)}
.paso-r.ya i{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-f)}
.paso-r.ya{font-weight:650}
.paso-r em{display:block;font-style:normal;font-size:.8rem;color:var(--suave);font-weight:400}
.dueno{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.big .meta-b{margin-top:auto;font-size:.8rem;font-weight:650;color:var(--pri)}
.big .meta-b.ok{color:var(--verde)}
details.sobre{background:transparent;border-top:1px solid var(--borde);padding-top:14px}
details.sobre>summary{font-size:1rem}
details.sobre[open]>summary{margin-bottom:14px}
details.sobre .grid2{margin-bottom:16px}
.diagbar{position:sticky;top:var(--topH,108px);z-index:10;background:var(--fondo);padding:8px 0;display:flex;align-items:center;gap:14px}
.diagbar .prog{flex:1;height:8px}
.diagbar small{white-space:nowrap;font-variant-numeric:tabular-nums}
.enlace{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.enlace input{flex:1 1 280px;font-family:ui-monospace,Consolas,monospace;font-size:.82rem}
.pie a{color:var(--suave)}
@media (max-width:640px){
  .sigue{grid-template-columns:1fr;padding:20px}
  .sigue .btn.p{width:100%}
  .tabs a{padding:9px 10px 10px}
  .quien{display:none}
}
.ctl .lnk{font-size:.84rem;color:var(--suave);text-decoration-color:var(--linea-in)}
.ctl .lnk:hover{color:var(--osc)}
@media (max-width:640px){.topin{flex-wrap:nowrap}.brand em{display:none}.ctl{width:auto}.brand b{font-size:.9rem}}

/* ===== Ejercicios nuevos ===== */
.clave{background:var(--pri-f);border-radius:10px;padding:14px 16px;max-width:72ch}
.clave b{color:var(--pri-d)}
.clave ul{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
h3.parte{margin-top:22px;padding-top:18px;border-top:1px solid var(--borde);font-size:1.02rem}
.ejercicio>h3.parte:first-of-type{margin-top:4px;padding-top:0;border-top:0}
.ops.cat{flex-direction:row;flex-wrap:wrap}
.ops.cat .op{flex:1 1 180px;text-align:center;font-weight:600}
code.url{display:inline-block;margin-top:8px;font-size:.95rem;word-break:break-all;background:#f3f5f3;color:var(--osc);border:1px solid var(--borde);padding:8px 12px;font-weight:500}
.reloj{font-size:.85rem;color:var(--suave);background:#f3f5f3;border-radius:20px;padding:3px 12px;font-variant-numeric:tabular-nums}
.reloj b{color:var(--rojo)}
.mail.wa .mh{background:#e9f3ee}
.mail.wa .mh span{width:auto;margin-right:8px;font-weight:650;color:var(--verde)}
.burbuja{background:#f3f5f3;border-radius:4px 14px 14px 14px;padding:10px 14px;align-self:flex-start;max-width:46ch}
.chk.r-ok span>small,.chk.r-mal span>small{display:block;margin-top:2px}
.chk.r-ok{border-left:3px solid var(--verde);padding-left:10px}
.chk.r-mal{border-left:3px solid var(--rojo);padding-left:10px;background:var(--rojo-f)}
.anon{font-size:1.02rem;line-height:2.1;background:#fff;border:1px solid var(--linea-in);border-radius:10px;padding:14px 16px}
.tok{font:inherit;border:1px dashed var(--linea-in);background:#f7f8f7;border-radius:6px;padding:2px 7px;cursor:pointer;color:var(--tinta)}
.tok:hover:not(:disabled){border-color:var(--pri)}
.tok.on{background:var(--osc);border:1px solid var(--osc);color:#fff}
.tok.t-ok{background:var(--verde-f);border:1px solid var(--verde);color:var(--verde);font-weight:600}
.tok.t-falta{background:var(--rojo-f);border:1px solid var(--rojo);color:var(--rojo);font-weight:600}
.tok.t-sobra{background:#eef0ee;border:1px solid var(--linea-in);color:var(--suave);text-decoration:line-through}
.tok:disabled{cursor:default}
.fb ul{margin:6px 0 0;padding-left:20px}
.fb p{margin-top:6px}
.mapa{background:#f5f7f5;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.mapa .dom{grid-template-columns:minmax(140px,220px) 1fr auto}
.mapa ul{margin:6px 0 0;padding-left:20px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.t.p30 td.acc{min-width:260px}
.t.p30 input[type=date]{min-width:150px}
.t.p30 th{vertical-align:middle}
.precios{align-items:end;gap:14px 18px}
.nw{white-space:nowrap}
.etapa.comp{background:transparent;box-shadow:none;border-style:dashed}
.etapa.comp .mini{margin-top:-4px}
.sigue.compl{background:var(--papel);color:var(--tinta);border:1px solid var(--borde);box-shadow:var(--sombra)}
.sigue.compl h2{color:var(--osc)} .sigue.compl p{color:var(--suave)} .sigue.compl .eyebrow{color:var(--pri)}
.sigue.compl .btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.repaso{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.repaso .card{padding:18px;gap:8px}
.repaso h2{font-size:1rem}
.repaso .lista{font-size:.93rem}
h2.sep small{display:block;margin:4px 0 0;font-size:.82rem}
.mbox p b{color:var(--osc)}
.segui{border-top:1px solid var(--borde);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.segui h3{margin:0}
.segt td,.segt th{white-space:nowrap}
.ok-t{color:var(--verde);font-weight:600}
.falta{color:var(--rojo);font-weight:600}
.wa-btn{background:#1f7a4d;border-color:#1f7a4d}

<script>
/* ===== Contenido del producto · Equipo DELTA ===== */
const LEMA = 'Protege la información de tus clientes y mantén tu despacho operando cuando algo salga mal.';

const FUENTES = {
  cff: { t: 'Código Fiscal de la Federación, artículos 17-D y 17-J, Cámara de Diputados', u: 'https://www.diputados.gob.mx/LeyesBiblio/pdf/CFF.pdf' },
  satApocrifos: { t: 'SAT · Correos apócrifos: recomendaciones y ejemplos', u: 'https://www.gob.mx/sat/acciones-y-programas/lista-de-correos-apocrifos' },
  satPortal: { t: 'SAT · Portal oficial (e.firma, Contraseña y CSD)', u: 'https://www.sat.gob.mx' },
  lfpdppp: { t: 'Ley Federal de Protección de Datos Personales en Posesión de los Particulares (nueva ley, DOF 20-03-2025; artículos 16, 18, 19 y 20), Cámara de Diputados', u: 'https://www.diputados.gob.mx/LeyesBiblio/pdf/LFPDPPP.pdf' },
  nist: { t: 'NIST · Publicación de la versión 2.0 del Cybersecurity Framework, 26 de febrero de 2024', u: 'https://www.nist.gov/news-events/news/2024/02/nist-releases-version-20-landmark-cybersecurity-framework' }
};

const MODULOS = [
  {
    n: 1, titulo: '¿Cómo identificar un intento de fraude?', tema: 'Phishing y fraudes digitales', lugar: 'Antes de la sesión (individual)', min: 18,
    solo: 'Se hace por tu cuenta antes de la sesión en vivo. En la sesión se comentan los mensajes más difíciles.',
    guia: ['¿Qué mensaje les costó más trabajo y por qué?', '¿Qué mensaje parecido ha llegado al despacho este año, por correo o WhatsApp, y qué se hizo?', 'Si mañana un cliente avisa por correo que cambió de cuenta bancaria, ¿quién le llama y a qué número?', '¿A quién se le reporta un correo sospechoso y por qué medio?', 'Acuerdo de salida: ningún pago ni cambio de cuenta sin llamada de confirmación a un número ya registrado.'],
    ejercicio: 'Simulador de mensajes fraudulentos',
    leccion: [
      ['Por qué le importa a tu despacho', 'Tu despacho recibe todos los días correos de clientes, proveedores y autoridades. Un solo mensaje falso que alguien abra con prisa puede dar acceso a la información fiscal de varias empresas a la vez. El phishing (mensajes que se hacen pasar por alguien de confianza para robar datos o dinero) no se detiene con tecnología solamente: se detiene cuando cada persona sabe qué revisar antes de dar clic.'],
      ['Las formas más comunes', '<ul><li><b>Correos falsos del SAT:</b> avisos de "irregularidad", "devolución de saldo a favor" o "vencimiento de e.firma" que piden entrar a un enlace o descargar un archivo.</li><li><b>Facturas maliciosas:</b> un adjunto que parece PDF o XML y en realidad es un programa (termina en .exe, .zip, .js o similar).</li><li><b>Enlaces fraudulentos:</b> el texto dice una cosa y la dirección real es otra. Pasa el cursor sobre el enlace sin dar clic para ver a dónde lleva.</li><li><b>Solicitudes falsas de pago o cambio de cuenta bancaria:</b> alguien se hace pasar por un cliente, un proveedor o el dueño del despacho y pide transferir "hoy mismo".</li><li><b>Voz o video generados con IA:</b> una llamada o un audio que suena como una persona conocida y pide algo fuera de lo normal.</li><li><b>Mensajes por WhatsApp o SMS:</b> "cambié de número", "te mandé un código por error". Con ese código de 6 dígitos, otra persona puede registrar tu cuenta en su teléfono y escribirles a tus clientes en tu nombre.</li><li><b>Códigos QR</b> en correos o carteles que llevan a un sitio falso. Un QR es un enlace que no puedes leer antes de abrirlo: trátalo igual que un enlace.</li></ul>'],
      ['Qué revisar en 30 segundos', '<ol><li><b>Remitente:</b> ¿la dirección completa coincide con la de siempre? Una letra cambiada basta para engañar.</li><li><b>Prisa o amenaza:</b> "último aviso", "en 24 horas", "no me llames". La urgencia busca que no verifiques.</li><li><b>Enlace o adjunto:</b> ¿lo esperabas? ¿La dirección real coincide con el sitio oficial?</li><li><b>Lo que pide:</b> nadie legítimo pide contraseñas, archivos .key ni datos bancarios por correo.</li></ol>'],
      ['Cuando el remitente sí es el de siempre', 'A veces el mensaje llega desde la <b>dirección real</b> de un cliente o proveedor, porque alguien entró a su cuenta de correo. En ese caso el remitente no te avisa de nada. Por eso la revisión más importante es la última: <b>qué te están pidiendo</b>. Si es dinero, un cambio de cuenta, una contraseña o un código, se verifica por otro canal aunque el remitente sea conocido.'],
      ['Sobre el SAT en particular', 'El SAT indica en su página sobre correos apócrifos que sus únicos sitios oficiales son <b>sat.gob.mx</b> y <b>gob.mx/sat</b>, que <b>no envía enlaces por correo</b>, que <b>no pide claves ni contraseñas</b> y que no solicita descargar ni ejecutar archivos. En esa misma página publica ejemplos de correos falsos detectados y cómo reportarlos. Ante la duda, no uses el enlace del correo: entra por tu cuenta al portal o al Buzón Tributario.'],
      ['La regla de oro del despacho', 'Toda solicitud de <b>pago, transferencia o cambio de cuenta bancaria</b> se confirma por un segundo canal: una llamada a un número que ya tenías registrado, nunca al que viene en el mensaje. Y si algo se ve raro, se reporta al responsable del despacho. Reportar una falsa alarma nunca es un error.'],
      ['Si ya diste clic', 'Pasa en todos los despachos. Lo que cambia el resultado es la rapidez: <ol><li><b>Avisa de inmediato</b> al responsable. Nadie se mete en problemas por avisar.</li><li>Si abriste un archivo, <b>desconecta el equipo de la red</b> y no lo sigas usando.</li><li>Si escribiste una contraseña, <b>cámbiala desde otro equipo</b> y revisa que la verificación en dos pasos esté activa.</li><li>Si se hizo una transferencia, <b>llama al banco en ese momento</b>: las primeras horas son las que cuentan.</li></ol>']
    ],
    clave: ['Antes de dar clic: remitente, prisa, enlace o adjunto, y qué te piden.', 'Pagos y cambios de cuenta: siempre con llamada a un número que ya tenías.', 'Contraseñas y códigos de verificación no se comparten con nadie, por ningún medio.', 'Si dudas, reporta. Si ya diste clic, avisa en ese momento.'],
    fuentes: ['satApocrifos']
  },
  {
    n: 2, titulo: '¿Quién tiene acceso a la información de mis clientes?', tema: 'Accesos al SAT, contraseñas y verificación en dos pasos', lugar: 'Autoaprendizaje', min: 9,
    ejercicio: 'Caso práctico y mapa de accesos',
    leccion: [
      ['Por qué le importa a tu despacho', 'Tus clientes te confían las llaves de su vida fiscal. Si esas llaves se guardan en una carpeta que todos pueden abrir, cualquier descuido (o cualquier persona que ya no trabaja contigo) puede usarlas. Saber quién accede a qué es el primer paso para proteger a tus clientes y a tu reputación.'],
      ['Las llaves que resguardas', '<ul><li><b>e.firma:</b> equivale a la firma autógrafa del contribuyente. Se compone de un certificado (.cer), una clave privada (.key) y la contraseña de esa clave privada.</li><li><b>CSD (Certificado de Sello Digital):</b> sirve para emitir facturas (CFDI). También tiene archivo .key y contraseña.</li><li><b>Contraseña del SAT (antes CIEC):</b> junto con el RFC, da acceso al portal del SAT.</li></ul>El Código Fiscal de la Federación establece que la firma electrónica avanzada sustituye a la firma autógrafa y produce los mismos efectos (artículo 17-D), y que el titular debe actuar con diligencia para impedir su uso no autorizado y responde de las consecuencias si no lo hace (artículo 17-J). Por eso, si un cliente te la confía, conviene dejar por escrito para qué la usarás y quién la tendrá.'],
      ['Cuatro reglas prácticas', '<ol><li><b>Los archivos .key y sus contraseñas nunca se guardan juntos.</b> Tampoco se envían por WhatsApp ni por correo.</li><li><b>Cada persona usa su propio usuario.</b> Las cuentas compartidas impiden saber quién hizo qué.</li><li><b>Cada quien ve solo a los clientes que atiende.</b> Menos accesos, menos exposición.</li><li><b>Cuando alguien sale del despacho, sus accesos se retiran ese mismo día</b> y se cambian las contraseñas que conocía.</li></ol>'],
      ['Gestor de contraseñas y verificación en dos pasos', 'Un <b>gestor de contraseñas</b> es un programa que guarda todas tus claves en una "caja fuerte" cifrada; solo recuerdas una contraseña maestra. La <b>verificación en dos pasos (MFA)</b> pide, además de la contraseña, un código temporal en tu celular. Se activa en la <b>configuración de seguridad de cada cuenta</b>: correo, nube, banca y software contable, cuando el servicio la ofrece. Con ella, una contraseña robada ya no basta para entrar. Cuando el servicio lo permita, usa una <b>aplicación de códigos</b> en lugar de mensajes SMS, y guarda los <b>códigos de recuperación</b> en un lugar seguro: son la llave de repuesto si pierdes el celular. Empieza por el correo, porque desde el correo se recuperan las demás contraseñas.'],
      ['Tu tarea', 'Primero resuelve un caso: el último día de un colaborador. Después completa el mapa de accesos de tu despacho. No escribas contraseñas ni datos de clientes: solo quién accede a qué y dónde se guardan las llaves.']
    ],
    clave: ['El archivo .key y su contraseña nunca se guardan ni se envían juntos; la contraseña va en un gestor de contraseñas.', 'Un usuario por persona, y acceso solo a los clientes que atiende.', 'La verificación en dos pasos se activa en la configuración de seguridad de cada cuenta; empieza por el correo y la banca.', 'El día que alguien sale del despacho, se retiran sus accesos.'],
    fuentes: ['cff', 'satPortal']
  },
  {
    n: 3, titulo: '¿Qué pasa si mañana desaparecen todos mis archivos?', tema: 'Respaldos y recuperación de información', lugar: 'Autoaprendizaje', min: 8,
    ejercicio: '¿Respaldo o no?, información crítica y prueba de restauración',
    leccion: [
      ['Por qué le importa a tu despacho', 'Un disco que falla, un equipo robado, un archivo borrado por error o un ataque pueden dejarte sin las contabilidades de tus clientes en plena fecha de vencimiento. La pregunta útil no es "¿tengo respaldo?", sino "¿cuánto tardaría en volver a trabajar?".'],
      ['Qué información es crítica', 'Contabilidades y pólizas, XML de CFDI, nóminas, expedientes de clientes, declaraciones presentadas y sus acuses, y la configuración del software contable. Si perderla detiene tu operación o te impide cumplir con un cliente, es crítica.'],
      ['Sincronizar no es respaldar', 'Una carpeta sincronizada en la nube copia tus archivos, pero <b>también copia los cambios y los borrados</b>. Si un archivo se daña o se cifra en tu computadora, la copia dañada puede reemplazar a la buena. Un <b>respaldo</b> guarda versiones anteriores en un lugar separado, de modo que puedas regresar a como estaba el archivo ayer o la semana pasada.'],
      ['Cómo se ve un buen respaldo', '<ul><li><b>Automático:</b> no depende de que alguien se acuerde.</li><li><b>Con una copia fuera del equipo y otra fuera de la oficina</b> (o desconectada), para que un mismo incidente no alcance todas las copias.</li><li><b>Con versiones:</b> permite recuperar el archivo de una fecha anterior.</li><li><b>Probado:</b> un respaldo que nunca se ha restaurado es solo una esperanza.</li></ul>Una forma fácil de recordarlo es la regla <b>3-2-1</b>: tres copias de lo importante, en dos medios distintos, y una fuera de la oficina o desconectada.'],
      ['Las dos preguntas que importan', '<ul><li><b>¿Cuánto trabajo puedo perder?</b> Si el respaldo es semanal y el problema ocurre el viernes, se pierde la semana. La frecuencia del respaldo decide cuánto habría que rehacer.</li><li><b>¿Cuánto tardo en volver a trabajar?</b> Tener la copia no basta: hay que saber quién la restaura, en qué equipo y cuánto tarda. Eso solo se sabe probándolo.</li></ul>'],
      ['Tu tarea', 'Clasifica seis situaciones reales, marca la información crítica de tu despacho y, en la reunión de entrega, haremos juntos una <b>prueba de restauración</b>: recuperar un archivo de prueba desde el respaldo y anotar cuánto tardó.']
    ],
    clave: ['Sincronizar no es respaldar: la sincronización copia también los cambios y borrados; el respaldo guarda versiones anteriores.', 'Un buen respaldo es automático, con versiones y con una copia fuera de la oficina o desconectada (regla 3-2-1).', 'Un respaldo que nunca se ha restaurado no cuenta: se prueba recuperando un archivo cada cierto tiempo.'],
    fuentes: ['nist']
  },
  {
    n: 4, titulo: 'Mi despacho sufrió un ataque de ransomware: ¿qué hago?', tema: 'Ransomware y plan de respuesta', lugar: 'Sesión en vivo', min: 20,
    solo: 'En la sesión en vivo se decide en equipo. Si la haces por tu cuenta, responde como lo harías desde tu puesto; el plan del despacho lo captura quien designe el titular.',
    guia: ['¿Quién de nosotros se daría cuenta primero y a quién le avisaría?', '¿Qué clientes tienen vencimiento esta semana y qué necesitaríamos para cumplirles?', '¿Dónde está el respaldo y quién sabe restaurarlo?', '¿Quién habla con los clientes afectados y qué les dice?', 'Acuerdo de salida: responsable, suplente y soporte técnico quedan escritos en el plan.'],
    ejercicio: 'Simulacro con reloj y plan de respuesta de 1 página',
    leccion: [
      ['Por qué le importa a tu despacho', 'El ransomware es un programa malicioso que cifra (vuelve ilegibles) tus archivos y pide un pago para devolverlos. Para un despacho, lo que está en juego es la continuidad: cumplir con los vencimientos de tus clientes aunque un equipo quede fuera de servicio.'],
      ['Señales de infección', 'Archivos que no abren o cambian de extensión, una nota en pantalla que pide un pago, equipos muy lentos de repente, o carpetas compartidas que dejan de estar disponibles.'],
      ['Los primeros minutos', '<ol><li><b>Aísla:</b> desconecta el equipo de la red (cable y Wi-Fi) para que no alcance a otros equipos ni a las carpetas compartidas.</li><li><b>Avisa:</b> al responsable de incidentes del despacho y al soporte técnico. Reportar rápido reduce el daño.</li><li><b>No borres ni reinstales por tu cuenta:</b> puede perderse información útil para recuperar.</li><li><b>Anota:</b> qué pasó, a qué hora, qué equipo y qué se estaba haciendo.</li></ol>Los demás equipos se desconectan de la carpeta compartida y no abren archivos hasta que soporte técnico lo indique.'],
      ['Recuperar y comunicar', 'La operación se recupera desde un respaldo verificado, en un equipo limpio, empezando por los clientes con vencimientos más cercanos. Pagar un rescate no garantiza recuperar la información. Si datos personales de clientes pudieron verse afectados, la Ley Federal de Protección de Datos Personales en Posesión de los Particulares (artículo 19) obliga a informarles de forma inmediata cuando la vulneración afecte de manera significativa sus derechos patrimoniales o morales. Conviene revisarlo con asesoría legal. Un aviso claro y oportuno cuida la confianza.'],
      ['Después del incidente', 'Cuando el despacho ya opera, falta cerrar: cambiar las contraseñas que se usaban en el equipo afectado, entender por dónde entró el problema, actualizar el plan y repasar con el equipo qué funcionó. Buscar culpables enseña a ocultar el siguiente error; buscar causas evita que se repita.'],
      ['Lo que te llevas', 'El simulacro lleva un reloj: cada decisión suma horas de interrupción. Al terminar, tu despacho tendrá su <b>plan de respuesta de una página</b>: quién decide, a quién se llama y en qué orden se recupera.']
    ],
    clave: ['Primeros minutos: aísla, avisa, no borres, anota.', 'Se restaura en un equipo limpio y por orden de vencimientos.', 'El plan impreso y con teléfonos, a la mano: si los equipos no sirven, no podrás abrirlo.'],
    fuentes: ['lfpdppp', 'nist']
  },

function blank() {
  return { v: 1, despachos: {}, participantes: {}, diagnostico: {}, proceso: {}, equipos: {}, kit: {}, encuesta: {}, hids: {}, estados: {}, plan30: {},
    config: { rangos: '', distribuidor: '' }, ui: { modo: 'despacho', did: null, pid: null } };
}
let memStore = null;
function load() {
  try { const t = localStorage.getItem(LS_KEY); if (t) return Object.assign(blank(), JSON.parse(t)); } catch (e) {}
  return memStore ? JSON.parse(memStore) : blank();
}
let S = load();
const T = { mod: null, quiz: null, ph: null, rs: null, ia: null, dl: null, confirm: null }; // estado temporal de pantalla
function save() {
  const t = JSON.stringify(S);
  memStore = t;

const b64u = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 8192) s += String.fromCharCode.apply(null, u8.subarray(i, i + 8192)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: t => { const b = atob(t.replace(/-/g, '+').replace(/_/g, '/')); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; } };
async function pasar(u8, Clase, fmt) { const st = new Blob([u8]).stream().pipeThrough(new Clase(fmt)); return new Uint8Array(await new Response(st).arrayBuffer()); }
async function codigoResultados(did) {
  const pk = { v: 1, despachos: { [did]: S.despachos[did] }, participantes: {}, diagnostico: {}, proceso: {}, equipos: {}, encuesta: {}, kit: {}, hids: {}, estados: {}, plan30: {} };
  participantesDe(did).forEach(p => { pk.participantes[p.id] = p; });
  ['diagnostico', 'encuesta', 'kit', 'hids', 'estados', 'plan30'].forEach(c => { if (S[c][did]) pk[c][did] = S[c][did]; });
  const u8 = new TextEncoder().encode(JSON.stringify(pk));
  try { if (typeof CompressionStream === 'function') return 'DELTA1Z.' + b64u.enc(await pasar(u8, CompressionStream, 'deflate-raw')); } catch (e) {}
  return 'DELTA1J.' + b64u.enc(u8);
}
/* Acepta uno o varios códigos pegados tal como llegan por WhatsApp o correo, con su encabezado */
async function leerCodigos(txt) {
  const t = String(txt || ''); let ms = t.match(/DELTA1[ZJ]\.[A-Za-z0-9_-]+/g);
  if (!ms) ms = t.replace(/\s+/g, '').match(/DELTA1[ZJ]\.[A-Za-z0-9_-]+/g);
  if (!ms) throw new Error('No encontré ningún código. Cada código empieza con DELTA1 y debe estar completo.');
  let n = 0; for (const c of ms) n += await leerCodigo(c);
  return { codigos: ms.length, n };
}
async function leerCodigo(txt) {
  const t = String(txt || '').replace(/\s+/g, ''); const m = /^DELTA1([ZJ])\.([A-Za-z0-9_-]+)$/.exec(t);
  if (!m) throw new Error('El texto no es un código de resultados. Debe empezar con DELTA1 y estar completo.');
  let u8 = b64u.dec(m[2]);
  if (m[1] === 'Z') u8 = await pasar(u8, DecompressionStream, 'deflate-raw');
  return combinar(JSON.parse(new TextDecoder().decode(u8)));
}

      <h3 class="parte">Parte 2 · El mapa de accesos de tu despacho</h3><p>Anota quién accede a qué. Usa puestos o alias, no nombres completos. No escribas contraseñas ni datos de clientes.</p>

      <p><button class="btn" data-a="accfila">Agregar persona</button></p>
      <div id="upd-mapa">${UPD.mapa()}</div>
      <div class="grid2">${fld('¿Dónde se guardan los archivos .key de los clientes?', sel(b + '.key', ['Carpeta con acceso restringido', 'Carpeta compartida por todos', 'Memoria USB', 'Correo o chat', 'No lo sé'], { r: 1 }))}
      ${fld('¿Dónde se guardan las contraseñas?', sel(b + '.pass', ['Gestor de contraseñas', 'Libreta o notas', 'Hoja de cálculo', 'De memoria o repetidas', 'No lo sé'], { r: 1 }))}</div>
      ${a.key && a.key !== 'Carpeta con acceso restringido' ? '<div class="fb mal">Los archivos .key conviene guardarlos en una carpeta a la que solo entren quienes los usan, separados de sus contraseñas.</div>' : ''}

  3: (p, did) => {

      `<h3 class="parte">Parte 2 · Información crítica de tu despacho</h3><p>Marca lo que, si se perdiera, detendría tu operación.</p><div class="cols2">${INFO_CRITICA.map((t, i) => chk(`${b}.info.${i}`, t)).join('')}</div>
      ${fld('¿Dónde están los respaldos hoy?', inp(b + '.donde', { ph: 'Por ejemplo: disco externo en la oficina y servicio en la nube' }))}

      <h3 class="parte">Parte 3 · Prueba de restauración <small>se hace en la reunión de entrega</small></h3><p>Elige un archivo de prueba (no de un cliente), recupéralo desde el respaldo y comprueba que abre.</p>

      <div class="grid3">${fld('Fecha de la prueba', inp(b + '.fecha', { type: 'date' }))}${fld('Minutos que tomó', inp(b + '.tiempo', { type: 'number', min: 0 }))}${fld('Observaciones', inp(b + '.obs', { ph: 'Qué funcionó y qué no' }))}</div>
      <div class="row end"><button class="btn p" data-a="hecho" data-v="3">Guardar y marcar el módulo como completado</button></div>`;
  },
  4: (p, did) => `<p class="escenario">${RANSOM.intro}</p>` + pasos('rs', ITEMS.rs, s => {
    const b = 'kit.' + did + '.plan', k = kit(did).plan, c = kit(did).calculadora, extra = s.h - RS_MEJOR;
    return `<div class="grid3 res"><div class="tile ${s.ok === ITEMS.rs.length ? 'ok' : ''}"><span>Decisiones acertadas</span><b>${s.ok} de ${ITEMS.rs.length}</b></div><div class="tile"><span>Tu reloj: interrupción</span><b>${hTxt(s.h)}</b></div><div class="tile"><span>El mejor camino</span><b>${hTxt(RS_MEJOR)}</b></div></div>
      <p>${extra > 0 ? `Tus decisiones sumaron <b>${hTxt(extra)}</b> de interrupción adicional.` : 'Seguiste el camino más corto: la interrupción que queda es la de restaurar.'} ${extra > 0 && calcListo(c) && num(c.horasDia) > 0 ? `Con los números que capturó tu despacho en la calculadora del Módulo 5, esas horas equivalen a unos <b>${mxn(extra / num(c.horasDia) * calcDia(c))}</b>.` : ''}</p>
      <p class="nota">Las horas del simulacro son ilustrativas: sirven para comparar decisiones, no son estadísticas ni un pronóstico.</p>
      <h3 class="parte">Ahora, el plan de tu despacho</h3><p>Captura los contactos de tu despacho. Usa puestos o nombres de pila; los teléfonos son los de tu despacho y tu soporte.</p>
      <div class="grid2">${fld('Responsable interno de incidentes', inp(b + '.resp', { ph: 'Quién coordina' }))}${fld('Suplente', inp(b + '.sup', { ph: 'Quién coordina si no está' }))}
      ${fld('Soporte técnico', inp(b + '.soporte', { ph: 'Persona o empresa' }))}${fld('Teléfono de soporte técnico', inp(b + '.soporteTel', { ph: 'Captúralo tú' }))}
      ${fld('A quién se avisa', inp(b + '.avisar', { ph: 'Socios, clientes afectados, asesor legal…' }))}${fld('Dónde están los respaldos', inp(b + '.respaldos', { ph: 'Ubicación y quién tiene acceso' }))}</div>
      ${fld('Qué se recupera primero', inp(b + '.prioridad', { ph: 'Por ejemplo: clientes con vencimiento más cercano' }))}

      <div class="grid3">${fld('Número de empleados', inp(b + '.empleados', o))}${fld('Costo por hora por empleado (MXN)', inp(b + '.costoHora', o))}${fld('Horas de trabajo por día', inp(b + '.horasDia', o))}
      ${fld('Ingresos diarios aproximados (MXN)', inp(b + '.ingresosDia', o), 'Si esos ingresos se recuperan trabajando después, escribe 0.')}${fld('Costo estimado de recuperación técnica (MXN)', inp(b + '.recuperacion', o), 'Soporte, reinstalación, restauración.')}${fld('Clientes con entregas en riesgo', inp(b + '.clientesRiesgo', o))}
      ${fld('Posibles recargos por cliente (MXN)', inp(b + '.recargoCliente', o), 'Estimación propia; déjalo en blanco si no aplica.')}</div>
      <h3 class="parte">Compara dos escenarios</h3>
      <div class="grid2">${fld('Días que hoy tardarían en volver a operar', inp(b + '.diasHoy', o), 'Tu mejor estimación. La prueba de restauración del Módulo 3 ayuda a afinarla.')}${fld('Días que tardarían con las medidas del plan', inp(b + '.diasMeta', o), 'Por ejemplo, con respaldo probado y un equipo de reemplazo.')}</div>

/* Bloques que se actualizan sin redibujar toda la pantalla */
const UPD = {
  diagprog: () => { const n = diag(S.ui.did).resp.filter(x => x != null).length, a = document.querySelector('nav a[href="#diagnostico"]'); if (a) a.innerHTML = 'Diagnóstico' + navEstado('diagnostico'); return `<div class="prog"><i style="width:${n / 30 * 100}%"></i></div><small><b>${n} de 30</b> contestadas${n === 30 ? ' · resultado abajo' : ''}</small>`; },
  rep: () => reporteHTML(S.ui.did),
  mapa: () => {
    const a = kit(S.ui.did).accesos, fs = a.filas.filter(f => (f.puesto || '').trim() || Object.values(f.s || {}).some(Boolean)), n = fs.length;
    if (!n) return '';
    const cnt = SISTEMAS.map((s, k) => fs.filter(f => f.s && f.s[k]).length), todo = fs.filter(f => SISTEMAS.every((s, k) => f.s && f.s[k])).length, notas = [];
    if (todo && n > 1) notas.push(`${todo} persona(s) tienen acceso a todo. Si una de esas cuentas se ve comprometida, queda expuesta toda la cartera: son las primeras donde activar la verificación en dos pasos.`);
    if (n >= 3 && cnt[0] === n) notas.push('Todas las personas entran al portal del SAT de clientes. Revisa si todas lo necesitan.');
    if (cnt[1] >= 3) notas.push(`${cnt[1]} personas operan la banca en línea. Entre menos, mejor; y conviene que quien captura un pago no sea quien lo autoriza.`);
    if (cnt[1] === 1 && n > 1) notas.push('Una sola persona opera la banca. Define quién la suple y cómo se le da acceso sin compartir su contraseña.');
    return `<div class="mapa"><b>Lo que dice tu mapa</b> <small>${n} persona(s)</small>${SISTEMAS.map((s, k) => `<div class="dom"><span>${s}</span><div class="bar"><i class="b-gris" style="width:${cnt[k] / n * 100}%;background:var(--pri)"></i></div><small>${cnt[k]} de ${n}</small></div>`).join('')}${notas.length ? `<ul>${notas.map(x => `<li>${x}</li>`).join('')}</ul>` : ''}</div>`;
  },
  calc: () => {
    const c = kit(S.ui.did).calculadora;
    if (!calcListo(c)) return '<p class="nota">Captura al menos empleados, costo por hora, horas por día e ingresos diarios para ver el resultado.</p>';
    const r = [1, 2, 3].map(d => calcCosto(c, d));
    return `<div class="scroll"><table class="t num"><thead><tr><th>Concepto</th><th>1 día</th><th>2 días</th><th>3 días</th></tr></thead><tbody>
      <tr><th>Horas improductivas</th>${r.map(x => `<td>${mxn(x.horas)}</td>`).join('')}</tr><tr><th>Ingresos no generados</th>${r.map(x => `<td>${mxn(x.ingresos)}</td>`).join('')}</tr>
      <tr><th>Recuperación técnica</th>${r.map(x => `<td>${mxn(x.recup)}</td>`).join('')}</tr><tr><th>Posibles recargos</th>${r.map(x => `<td>${mxn(x.recargos)}</td>`).join('')}</tr>
      <tr class="tot"><th>Costo estimado</th>${r.map(x => `<td>${mxn(x.total)}</td>`).join('')}</tr></tbody></table></div>
      <p class="nota">${pill('Supuestos capturados por el despacho', 'sup')} Fórmula: empleados × costo por hora × horas por día × días + ingresos diarios × días + recuperación técnica + clientes en riesgo × recargo por cliente. No incluye la posible pérdida de clientes.</p>${calcComp(c)}`;
  },
  diagres: () => {
    const did = S.ui.did, st = diagStats(did), hs = ordenGravedad(hallazgos(did).filter(h => h.origen === 'Diagnóstico'));
    return `<div class="card resumen"><div class="rh"><div><h2>Resultado</h2><p>${st.contestadas} de 30 preguntas contestadas${st.total == null ? '' : ' · madurez general ' + Math.round(st.total) + '%'}</p></div>${sem(st.sem, st.total)}</div>
      <div class="doms">${st.dom.map(d => `<div class="dom"><span>${d.n}</span><div class="bar"><i class="b-${d.sem}" style="width:${d.pct == null ? 0 : Math.max(4, d.pct)}%"></i></div>${sem(d.sem, d.pct)}</div>`).join('')}</div>
      <p class="nota">Semáforo: rojo menos de 40%, amarillo de 40% a 70%, verde más de 70%.</p>
      <h3>${hs.length} hallazgo(s) generados por el diagnóstico</h3>${hs.length ? `<ul class="hall">${hs.map(h => `<li><b>${h.id}</b> ${esc(h.titulo)} ${gpill(h.g)}</li>`).join('')}</ul><div class="row"><a class="btn" href="#reporte">Ver mi reporte</a>${st.contestadas === 30 ? '<button class="btn p" data-a="codigo" data-v="diag">Enviar mis resultados al Equipo DELTA</button>' : ''}</div>` : '<p class="nota">Cada respuesta "No" o "Parcialmente" genera un hallazgo con acciones sugeridas.</p>'}</div>`;
  },
  prochall: () => listaHall(hallazgos(S.ui.did).filter(h => h.origen === 'Proceso'), 'Marca un riesgo en cualquier paso para generar un hallazgo.'),
  invhall: () => listaHall(hallazgos(S.ui.did).filter(h => h.origen === 'Inventario'), 'Las reglas se aplican solas al capturar cada equipo.')
};
const listaHall = (hs, vacio) => `<div class="card"><h2>${hs.length} hallazgo(s)</h2>${hs.length ? `<div class="scroll"><table class="t"><thead><tr><th>ID</th><th>Hallazgo</th><th>Gravedad</th><th>Acción sin costo</th><th>Acción de bajo costo</th><th>Categoría Dell candidata</th></tr></thead><tbody>${ordenGravedad(hs).map(h => `<tr><th>${h.id}</th><td>${esc(h.titulo)}<br><small>${esc(h.riesgo)}</small></td><td>${gpill(h.g)}</td><td>${esc(h.a0)}</td><td>${esc(h.a1)}</td><td>${h.d ? esc(DELL[h.d]) : '—'}</td></tr>`).join('')}</tbody></table></div>` : `<p class="nota">${vacio}</p>`}</div>`;

/* --- Diagnóstico --- */
V.diagnostico = () => {

/* --- Encuesta --- */

  if (!S.encuesta[d.id]) S.encuesta[d.id] = {};
  const b = 'encuesta.' + d.id, e = S.encuesta[d.id], precio = (k, t, h) => fld(t, inp(b + '.' + k, { type: 'number', min: 0, ph: '$ al mes' }), h);

      ${fld('¿Qué módulo fue el más útil?', `<select id="${idOf(b + '.modulo')}" data-bind="${b}.modulo"><option value="">Elige…</option>${MODULOS.map(m => `<option value="${m.n}"${String(e.modulo) === String(m.n) ? ' selected' : ''}>${m.n}. ${m.titulo}</option>`).join('')}<option value="otro"${e.modulo === 'otro' ? ' selected' : ''}>Otro</option></select>`)}
      ${fld('Si quieres, cuéntanos por qué', inp(b + '.moduloOtro'))}
      <div class="f"><label id="lc">¿Contratarías un servicio así de forma mensual?</label><div class="r3" role="radiogroup" aria-labelledby="lc">${['Sí', 'Tal vez', 'No'].map(t => `<label><input type="radio" name="contr" value="${t}" data-bind="${b}.contrataria" ${e.contrataria === t ? 'checked' : ''}><span>${t}</span></label>`).join('')}</div></div></div>
    <div class="card"><h2>¿Cuánto valdría para tu despacho?</h2><p>Imagina que el servicio continúa como suscripción mensual: capacitación periódica, simulacros y seguimiento de los hallazgos. Escribe un precio <b>al mes, en pesos</b>, para cada pregunta. No hay respuestas correctas, y no mostramos precios para no influir en la tuya.</p>
      <div class="cols2r precios">${precio('pagoBarato', '¿A qué precio te parecería barato, una buena compra?')}${precio('pagoRazonable', '¿Qué precio te parecería razonable?')}${precio('pagoCaro', '¿A partir de qué precio te parecería caro, aunque lo pensarías?')}${precio('pagoMuyCaro', '¿A partir de qué precio sería demasiado caro para considerarlo?')}</div>
      ${fld('Y por lo que recibiste en este piloto (capacitación, diagnóstico y reporte), en un solo pago, ¿qué precio te parecería razonable?', inp(b + '.pagoInicial', { type: 'number', min: 0, ph: '$ en un solo pago' }), 'Durante el piloto no tiene costo. La pregunta es para saber cuánto vale.')}</div>
    <div class="card">${fld('Comentarios', area(b + '.comentarios', { rows: 3 }))}

/* --- Mi reporte --- */
V.reporte = () => {

  alinicio: () => { T.mod = null; location.hash = 'inicio'; },
  repsalir: () => { T.repaso = null; render(); arriba(); },
  repfin: () => { const p = P(); p.repaso = true; p.ts = Date.now(); save(); T.repaso = null; if (!p.quizFinal && p.quizInicial) ACC.paso('q:quizFinal'); else { render(); arriba(); } },
  calc: () => { T.mod = 5; T.quiz = T.ph = T.st = T.repaso = null; if (location.hash === '#capacitacion') { render(); arriba(); } else location.hash = 'capacitacion'; },
  salrev: () => { T.sal.rev = true; render(); },
  salre: () => { T.sal = null; render(); },
  antog: v => { const z = T.an; z.sel[v] = !z.sel[v]; render(); },
  anrev: () => { T.an.rev = true; render(); },
  anre: () => { T.an = null; render(); },
  plan30auto: () => { const n = proponerPlan(S.ui.did); render(); toast(n ? 'Propuesta lista: ajusta responsables y fechas.' : 'Aún no hay hallazgos.'); },
  plantodos: () => { T.planTodos = !T.planTodos; render(); },
  plan: () => { const k = kit(S.ui.did).plan; k.listo = true; k.ts = Date.now(); marcar(P(), 4); render(); toast('Plan de respuesta generado.'); },
  politica: () => { const k = kit(S.ui.did).politica; k.listo = true; k.ts = Date.now(); marcar(P(), 7); render(); toast('Política de uso de IA generada.'); },
  hecho: v => {
    const n = +v, k = kit(S.ui.did);
    if (n === 5) { if (!calcListo(k.calculadora)) return toast('Faltan datos para calcular el costo.'); k.calculadora.fecha = hoy(); k.calculadora.ts = Date.now(); }
    marcar(P(), n); T.mod = null; if (!P()) { location.hash = 'inicio'; if (n === 5) ACC.codigo('calc'); else toast('Guardado.'); return; } render(); arriba(); if (n === 5) ACC.codigo('calc'); else toast('Módulo ' + n + ' completado.');
  },
  accfila: () => { const a = kit(S.ui.did).accesos; a.filas.push({ puesto: '', s: {} }); a.ts = Date.now(); save(); render(); },
  encuesta: () => { const e = S.encuesta[S.ui.did] || {}; if (!e.utilidad) return toast('Falta calificar la utilidad del servicio (1 a 5).'); if (!pagoOrden(e)) return toast('Revisa los cuatro precios: deberían ir de menor a mayor.'); e.ts = Date.now(); e.fecha = hoy(); save(); render(); ACC.codigo('encuesta'); },
  pdf: v => { const did = S.ui.did, n = slug(S.despachos[did].nombre); if (v === 'plan') pdf(planHTML(did), 'plan-de-respuesta-' + n); else if (v === 'politica') pdf(politicaHTML(did), 'politica-de-ia-' + n); else pdf(reporteHTML(did), 'reporte-' + n); },
  nuevo: () => {
    let id = codigo(); while (S.despachos[id]) id = codigo();
    const g = x => document.getElementById(x).value.trim();
    S.despachos[id] = { id, nombre: g('nd-nombre') || POR_DEFINIR, empleados: g('nd-emp'), computadoras: g('nd-pc'), decide: '', responsable: '', fechaSesion: '', fechaEntrega: '', horas: '', ts: Date.now() };
    S.ui.did = id; S.ui.pid = null; save(); render(); toast('Despacho registrado. Código para el personal: ' + id);
  },
  usar: v => { S.ui.did = v; S.ui.pid = null; T.mod = T.quiz = T.ph = T.st = null; save(); render(); },
  conf: v => { T.confirm = v || null; render(); },
  borrar: v => { borrarDespacho(v); T.confirm = null; render(); toast('Despacho eliminado.'); },
  eqadd: () => { const e = equipos(S.ui.did); e.items.push({ id: rid('e'), nombre: '', marca: '', anios: '', so: '', act: '', av: '', resp: '', comp: '', pass: '' }); e.ts = Date.now(); save(); render(); },
  eqdel: v => { const e = equipos(S.ui.did); e.items.splice(+v, 1); e.ts = Date.now(); save(); render(); },
  csv: () => guardar('tablero-piloto-' + hoy() + '.csv', csvTablero(), 'text/csv'),
  codigo: async v => { if (!S.ui.did) return toast('Primero elige tu despacho.'); const c = await codigoResultados(S.ui.did), p = P(); const ant = v === 'quizInicial' ? `<b>Quiz inicial guardado.</b> Ahora envía este código al Equipo DELTA: es lo que permite medir tu avance al final. ` : v === 'quizFinal' ? `<b>Quiz final guardado${p && p.quizInicial ? ': pasaste de ' + r1(p.quizInicial.pct) + '% a ' + r1(p.quizFinal.pct) + '%' : ''}.</b> Envía este código al Equipo DELTA para que tu resultado cuente. ` : v === 'diag' ? `<b>Diagnóstico completo.</b> Envía este código al Equipo DELTA antes de la reunión de entrega: con él preparan tu reporte. ` : v === 'calc' ? `<b>Calculadora guardada.</b> Envía este código al Equipo DELTA para que tu estimación aparezca en el reporte. ` : v === 'encuesta' ? `<b>Gracias, tu encuesta quedó guardada.</b> Envía este código al Equipo DELTA para que la reciban. ` : ''; const d = D(), txt = 'Resultados para el Equipo DELTA · ' + (p ? p.alias : 'Dueño o socio') + ' · ' + (d ? d.nombre + ' (' + d.id + ')' : '') + (ETQ[v] ? ' · ' + ETQ[v] : '') + '\n' + c; T.envio = txt;
    copiaManual(v ? 'Envía tus resultados' : 'Tus resultados', txt, ant + 'Toca <b>Enviar por WhatsApp</b> y elige el chat del Equipo DELTA. Si no se abre, usa <b>Copiar</b> y pégalo en un mensaje (WhatsApp o correo). Contiene tu alias y tus respuestas; no incluye datos de clientes.', true); },
  compartir: () => {
    const txt = T.envio || (document.getElementById('m-txt') || {}).value || '';
    const wa = () => { const w = window.open('https://wa.me/?text=' + encodeURIComponent(txt), '_blank', 'noopener'); if (!w) toast('No se pudo abrir WhatsApp. Usa Copiar y pégalo en el chat.'); };
    if (navigator.share && !EMBEBIDO) { navigator.share({ text: txt }).then(() => toast('Listo. Gracias por enviar tus resultados.'), e => { if (!e || e.name !== 'AbortError') wa(); }); }
    else wa();
  },
  impcod: async () => { try { const r = await leerCodigos(document.getElementById('in-cod').value); render(); toast(r.codigos + ' código(s) importado(s): ' + r.n + ' registro(s) nuevos o actualizados.'); } catch (e) { toast('No se pudo importar: ' + e.message); } },
  exportar: () => guardar('datos-piloto-' + hoy() + '.json', exportar(), 'application/json'),
  demo: () => { cargarDemo(); render(); toast('Despacho de ejemplo cargado.'); },
  reset: () => { const ui = S.ui; S = blank(); S.ui.modo = ui.modo; T.confirm = null; save(); render(); toast('Datos borrados.'); },
  mcerrar: () => { document.getElementById('modal').className = ''; },
  mcopiar: () => { const t = document.getElementById('m-txt'); t.select(); try { navigator.clipboard.writeText(t.value).then(() => toast('Copiado.'), () => toast('Selecciona el texto y cópialo.')); } catch (e) { toast('Selecciona el texto y cópialo.'); } }
};

function onBind(el) {
  let v;
  if (el.type === 'checkbox') v = el.checked;
  else if (el.type === 'radio') { if (!el.checked) return; v = el.hasAttribute('data-num') ? Number(el.value) : el.value; }
  else v = el.value;
  setPath(el.dataset.bind, v);
  if (el.dataset.upd) el.dataset.upd.split(' ').forEach(k => { const t = document.getElementById('upd-' + k); if (t) t.innerHTML = UPD[k](); });
  if (el.hasAttribute('data-r')) render();
  if (/^diagnostico\./.test(el.dataset.bind)) { const dg = diag(S.ui.did); if (!dg.aviso && dg.resp.every(x => x != null)) { dg.aviso = true; save(); ACC.codigo('diag'); } }
}
const DISCRETO = t => t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT';
document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  e.preventDefault(); const f = ACC[b.dataset.a]; if (f) f(b.dataset.v);
});
document.addEventListener('input', e => { const t = e.target; if (t.dataset && t.dataset.bind && !DISCRETO(t)) onBind(t); });
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.bind && DISCRETO(t)) return onBind(t);
  if (t.dataset.sen != null && T.ph) { T.ph.sen[t.dataset.sen] = t.checked; return; }
  if (t.dataset.sal != null && T.sal) { T.sal.m[t.dataset.sal] = t.checked; return; }
  if (t.dataset.c === 'did') { S.ui.did = t.value || null; S.ui.pid = null; T.mod = T.quiz = T.ph = T.st = null; save(); render(); return; }
  if (t.id === 'in-json' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { try { const n = combinar(JSON.parse(fr.result)); render(); toast('Datos combinados: ' + n + ' registro(s) nuevos o actualizados.'); } catch (err) { toast('No se pudo importar: ' + err.message); } };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'in-codigo') ACC.unir(); if (e.key === 'Enter' && e.target.id === 'in-alias') ACC.alias(); if (e.key === 'Enter' && e.target.id === 'in-acceso') ACC.acceso(); if (e.key === 'Escape' && document.getElementById('modal').className === 'on') ACC.mcerrar(); });
window.addEventListener('hashchange', () => { T.confirm = null; render(); arriba(); });
window.addEventListener('afterprint', () => { document.getElementById('print-area').innerHTML = ''; });
(function entrarPorEnlace() {
  const m = (location.search || '').match(/[?&]d=(D-[A-Z0-9]{4})\b/i); if (!m) return;
  const c = m[1].toUpperCase();
  if (!S.despachos[c]) S.despachos[c] = { id: c, nombre: 'Despacho ' + c, stub: true, ts: Date.now() };
  S.ui.did = c; S.ui.pid = null; S.ui.modo = 'despacho'; save();
  try { history.replaceState(null, '', location.pathname + '#inicio'); } catch (e) {}
})();
function medirTop() { const h = document.querySelector('.top'); if (h) document.documentElement.style.setProperty('--topH', h.offsetHeight + 'px'); }
window.addEventListener('resize', medirTop);
render();

</script>
</body>
